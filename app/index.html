<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>Pattern VLA</title>
<style>
  :root { --bg:#fbfbfb; --panel:#fff; --line:#e6e6e6; --ink:#111; --muted:#777; --accent:#c026d3; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  #app { display:flex; flex-direction:column; height:100dvh; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); font-weight:600; font-size:15px;
           display:flex; align-items:center; gap:10px; }
  header .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
  header .title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .sub { color:var(--muted); font-weight:400; }
  #back { display:none; border:1px solid var(--line); background:#f4f4f6; color:var(--ink);
          border-radius:14px; padding:4px 10px; font-size:13px; font-weight:600; }
  #view { flex:1 1 55%; overflow:auto; background:#fff; display:flex; align-items:center; justify-content:center; padding:8px; }
  #view svg { max-width:100%; height:auto; }
  #view .empty { color:var(--muted); font-size:14px; text-align:center; padding:24px; }
  /* block picker */
  #picker { display:none; width:100%; max-width:520px; padding:14px; }
  #picker h2 { font-size:15px; margin:4px 4px 12px; }
  .block { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:14px;
           padding:14px 16px; margin-bottom:10px; font-size:16px; font-weight:600; display:flex;
           justify-content:space-between; align-items:center; }
  .block small { color:var(--muted); font-weight:400; }
  #chat { flex:1 1 45%; display:flex; flex-direction:column; border-top:1px solid var(--line);
          background:var(--panel); min-height:36%; }
  #log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 11px; border-radius:14px; font-size:14px; line-height:1.35; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:#f0f0f2; color:var(--ink); border-bottom-left-radius:4px; }
  .stat { font-size:12px; color:var(--muted); padding:0 12px 8px; }
  #bar { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  #bar input { flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:22px; font-size:15px; outline:none; }
  #bar button { padding:0 16px; border:0; border-radius:22px; background:var(--ink); color:#fff; font-size:15px; font-weight:600; }
  #bar button:disabled { opacity:.5; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="dot"></span>
    <span class="title" id="title">Pattern VLA</span>
    <button id="back">← Blocks</button>
  </header>
  <div id="view">
    <div id="picker"></div>
    <div class="empty" id="viewempty">Loading…</div>
  </div>
  <div id="chat">
    <div id="log"></div>
    <div class="stat" id="stat"></div>
    <div id="bar">
      <input id="input" placeholder="Pick a block above to start" autocomplete="off" disabled />
      <button id="send" disabled>Send</button>
    </div>
  </div>
</div>
<script>
const API = location.origin;
let sessionId = null;
let pieces = [];
const view = document.getElementById('view');
const picker = document.getElementById('picker');
const viewempty = document.getElementById('viewempty');
const svgHost = document.createElement('div');
view.appendChild(svgHost);
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');
const stat = document.getElementById('stat');
const title = document.getElementById('title');
const back = document.getElementById('back');

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
async function api(path, body) {
  const r = await fetch(API + path, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {}),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function showPicker(pieces) {
  svgHost.innerHTML = '';
  viewempty.style.display = 'none';
  picker.style.display = 'block';
  back.style.display = 'none';
  title.textContent = 'Pattern VLA';
  stat.textContent = '';
  input.disabled = send.disabled = true;
  input.placeholder = 'Pick a block above to start';
  picker.innerHTML = '<h2>Which block do you want to work on?</h2>';
  pieces.forEach(p => {
    const b = document.createElement('button');
    b.className = 'block';
    b.innerHTML = `<span>${p.name}</span><small>${p.object_count} objects</small>`;
    b.onclick = () => selectBlock(p.id, p.name);
    picker.appendChild(b);
  });
}

function showBlock(data) {
  picker.style.display = 'none';
  viewempty.style.display = 'none';
  if (data.svg) svgHost.innerHTML = data.svg;
  back.style.display = 'inline-block';
  title.innerHTML = `${data.piece.name} <span class="sub">· block</span>`;
  if (data.state) stat.textContent = `${data.state.object_count} objects in this block`;
  input.disabled = send.disabled = false;
  input.placeholder = 'e.g. let out the waist 2cm';
  input.focus();
}

async function boot() {
  try {
    const data = await api('/api/session', {});
    sessionId = data.session_id;
    pieces = data.pieces;
    showPicker(pieces);
    if (data.reply) addMsg(data.reply, 'bot');
  } catch (e) {
    viewempty.textContent = 'Could not reach backend. Start it with: uvicorn app:app --app-dir backend --port 8000';
  }
}

async function selectBlock(pieceId, name) {
  addMsg('Work on: ' + name, 'user');
  try {
    const data = await api(`/api/session/${sessionId}/select_piece`, {piece_id: pieceId});
    showBlock(data);
    if (data.reply) addMsg(data.reply, 'bot');
  } catch (e) {
    addMsg('⚠️ ' + e, 'bot');
  }
}

async function submit() {
  const text = input.value.trim();
  if (!text || !sessionId) return;
  addMsg(text, 'user');
  input.value = '';
  input.disabled = send.disabled = true;
  try {
    const data = await api(`/api/session/${sessionId}/message`, {text});
    showBlock(data);
    if (data.reply) addMsg(data.reply, 'bot');
  } catch (e) {
    addMsg('⚠️ request failed: ' + e, 'bot');
  } finally {
    input.disabled = send.disabled = false;
    input.focus();
  }
}

back.onclick = () => showPicker(pieces);  // same session — edits persist
send.onclick = submit;
input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
boot();
</script>
</body>
</html>
