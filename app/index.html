<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>Pattern VLA</title>
<style>
  :root { --bg:#fbfbfb; --panel:#fff; --line:#e6e6e6; --ink:#111; --muted:#777; --accent:#c026d3; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  #app { display:flex; flex-direction:column; height:100dvh; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); font-weight:600; font-size:15px;
           display:flex; align-items:center; gap:8px; }
  header .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); }
  #view { flex:1 1 55%; overflow:auto; background:#fff; display:flex; align-items:center; justify-content:center; }
  #view svg { max-width:100%; height:auto; }
  #view .empty { color:var(--muted); font-size:14px; }
  #chat { flex:1 1 45%; display:flex; flex-direction:column; border-top:1px solid var(--line);
          background:var(--panel); min-height:38%; }
  #log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:8px 11px; border-radius:14px; font-size:14px; line-height:1.35; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:#f0f0f2; color:var(--ink); border-bottom-left-radius:4px; }
  #bar { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  #bar input { flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:22px; font-size:15px; outline:none; }
  #bar button { padding:0 16px; border:0; border-radius:22px; background:var(--ink); color:#fff; font-size:15px; font-weight:600; }
  #bar button:disabled { opacity:.5; }
  .stat { font-size:12px; color:var(--muted); padding:0 12px 8px; }
</style>
</head>
<body>
<div id="app">
  <header><span class="dot"></span> Pattern VLA <span id="pname" style="color:var(--muted);font-weight:400"></span></header>
  <div id="view"><div class="empty">Loading base pattern…</div></div>
  <div id="chat">
    <div id="log"></div>
    <div class="stat" id="stat"></div>
    <div id="bar">
      <input id="input" placeholder="e.g. let out the waist 2cm" autocomplete="off" disabled />
      <button id="send" disabled>Send</button>
    </div>
  </div>
</div>
<script>
const API = location.origin;
let sessionId = null;
const view = document.getElementById('view');
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');
const stat = document.getElementById('stat');
const pname = document.getElementById('pname');

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
function paint(data) {
  if (data.svg) view.innerHTML = data.svg;
  if (data.state) {
    const c = data.state.coverage, p = data.state.pattern;
    pname.textContent = '· ' + (p.name || '');
    const pieces = data.state.pieces.length;
    stat.textContent = `${c.resolved}/${c.total} objects resolved · ${pieces} pieces · ${data.state.objects.filter(o=>o.is_final_outline).length} final-outline`;
  }
}
async function boot() {
  try {
    const r = await fetch(API + '/api/session', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'});
    const data = await r.json();
    sessionId = data.session_id;
    paint(data);
    if (data.reply) addMsg(data.reply, 'bot');
    input.disabled = send.disabled = false;
    input.focus();
  } catch (e) {
    view.innerHTML = '<div class="empty">Could not reach backend. Start it with:<br>uvicorn app:app --port 8000</div>';
  }
}
async function submit() {
  const text = input.value.trim();
  if (!text || !sessionId) return;
  addMsg(text, 'user');
  input.value = '';
  input.disabled = send.disabled = true;
  try {
    const r = await fetch(`${API}/api/session/${sessionId}/message`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({text})
    });
    const data = await r.json();
    paint(data);
    if (data.reply) addMsg(data.reply, 'bot');
  } catch (e) {
    addMsg('⚠️ request failed: ' + e, 'bot');
  } finally {
    input.disabled = send.disabled = false;
    input.focus();
  }
}
send.onclick = submit;
input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
boot();
</script>
</body>
</html>
