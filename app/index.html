<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>Pattern VLA</title>
<style>
  :root { --bg:#fbfbfb; --panel:#fff; --line:#e6e6e6; --ink:#111; --muted:#777; --accent:#c026d3; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; font-family:-apple-system,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  #app { display:flex; flex-direction:column; height:100dvh; }
  header { padding:8px 12px; border-bottom:1px solid var(--line); font-weight:600; font-size:14px;
           display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  header .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
  header .title { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .sub { color:var(--muted); font-weight:400; }
  #back { display:none; border:1px solid var(--line); background:#f4f4f6; color:var(--ink);
          border-radius:14px; padding:4px 10px; font-size:13px; font-weight:600; }

  /* pattern takes all remaining space; svg is contained so the whole block shows */
  #view { flex:1 1 auto; min-height:0; overflow:auto; display:flex; align-items:center;
          justify-content:center; padding:6px; background:#fff; }
  #view.scroll { align-items:flex-start; }
  #view svg { max-width:100%; max-height:100%; width:auto; height:auto; display:block; }
  #view .empty { color:var(--muted); font-size:14px; text-align:center; padding:24px; }

  /* block picker */
  #picker { display:none; width:100%; max-width:520px; padding:14px; }
  #picker h2 { font-size:15px; margin:4px 4px 12px; }
  .block { width:100%; text-align:left; border:1px solid var(--line); background:#fff; border-radius:14px;
           padding:16px 16px; margin-bottom:10px; font-size:17px; font-weight:600; display:flex;
           justify-content:space-between; align-items:center; }
  .block small { color:var(--muted); font-weight:400; }

  /* compact, collapsible chat */
  #chat { flex:0 0 auto; display:flex; flex-direction:column; border-top:1px solid var(--line); background:var(--panel); }
  .chattab { display:flex; align-items:center; gap:8px; padding:4px 12px; }
  .chattab .last { flex:1; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #toggle { border:0; background:transparent; color:var(--muted); font-size:16px; padding:4px 6px; line-height:1; }
  #log { max-height:16vh; overflow-y:auto; padding:6px 12px 4px; display:flex; flex-direction:column; gap:7px; }
  #log.collapsed { display:none; }
  .msg { max-width:88%; padding:7px 11px; border-radius:14px; font-size:14px; line-height:1.35; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:#f0f0f2; color:var(--ink); border-bottom-left-radius:4px; }
  #bar { display:flex; gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }
  #bar input { flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:22px; font-size:16px; outline:none; }
  #bar button { padding:0 16px; border:0; border-radius:22px; background:var(--ink); color:#fff; font-size:15px; font-weight:600; }
  #bar button:disabled { opacity:.5; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="dot"></span>
    <span class="title" id="title">Pattern VLA</span>
    <button id="back">← Blocks</button>
  </header>
  <div id="view">
    <div id="picker"></div>
    <div class="empty" id="viewempty">Loading…</div>
  </div>
  <div id="chat">
    <div class="chattab">
      <span class="last" id="stat"></span>
      <button id="toggle" title="Show/hide chat">⌄</button>
    </div>
    <div id="log"></div>
    <div id="bar">
      <input id="input" placeholder="Pick a block above to start" autocomplete="off" disabled />
      <button id="send" disabled>Send</button>
    </div>
  </div>
</div>
<script>
const API = location.origin;
let sessionId = null;
let blocks = [];
const view = document.getElementById('view');
const picker = document.getElementById('picker');
const viewempty = document.getElementById('viewempty');
const svgHost = document.createElement('div');
svgHost.style.cssText = 'display:none;width:100%;height:100%;align-items:center;justify-content:center;';
view.appendChild(svgHost);
const log = document.getElementById('log');
const input = document.getElementById('input');
const send = document.getElementById('send');
const stat = document.getElementById('stat');
const title = document.getElementById('title');
const back = document.getElementById('back');
const toggle = document.getElementById('toggle');

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  if (who === 'bot') stat.textContent = text;   // peek of latest reply in the tab
}
async function api(path, body) {
  const r = await fetch(API + path, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body || {}),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function showPicker(list) {
  svgHost.innerHTML = '';
  svgHost.style.display = 'none';
  viewempty.style.display = 'none';
  picker.style.display = 'block';
  view.classList.add('scroll');
  back.style.display = 'none';
  title.textContent = 'Pattern VLA';
  input.disabled = send.disabled = true;
  input.placeholder = 'Pick a block above to start';
  picker.innerHTML = '<h2>Which block do you want to work on?</h2>';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'block';
    const sub = b.pieces.length > 1 ? `${b.pieces.length} pieces` : '1 piece';
    el.innerHTML = `<span>${b.label}</span><small>${sub}</small>`;
    el.onclick = () => selectBlock(b.key, b.label);
    picker.appendChild(el);
  });
}

function showBlock(data) {
  picker.style.display = 'none';
  viewempty.style.display = 'none';
  view.classList.remove('scroll');
  svgHost.style.display = 'flex';
  if (data.svg) svgHost.innerHTML = data.svg;
  back.style.display = 'inline-block';
  title.innerHTML = `${data.block.label} <span class="sub">· block</span>`;
  input.disabled = send.disabled = false;
  input.placeholder = 'e.g. let out the waist 2cm';
  input.focus();
}

async function boot() {
  try {
    const data = await api('/api/session', {});
    sessionId = data.session_id;
    blocks = data.blocks;
    showPicker(blocks);
    if (data.reply) addMsg(data.reply, 'bot');
  } catch (e) {
    viewempty.textContent = 'Could not reach backend.';
  }
}

async function selectBlock(key, label) {
  addMsg('Work on: ' + label, 'user');
  try {
    const data = await api(`/api/session/${sessionId}/select_block`, {block: key});
    showBlock(data);
    if (data.reply) addMsg(data.reply, 'bot');
  } catch (e) { addMsg('⚠️ ' + e, 'bot'); }
}

async function submit() {
  const text = input.value.trim();
  if (!text || !sessionId) return;
  addMsg(text, 'user');
  input.value = '';
  input.disabled = send.disabled = true;
  try {
    const data = await api(`/api/session/${sessionId}/message`, {text});
    showBlock(data);
    if (data.reply) addMsg(data.reply, 'bot');
  } catch (e) {
    addMsg('⚠️ request failed: ' + e, 'bot');
  } finally {
    input.disabled = send.disabled = false;
    input.focus();
  }
}

toggle.onclick = () => {
  log.classList.toggle('collapsed');
  toggle.textContent = log.classList.contains('collapsed') ? '⌃' : '⌄';
};
back.onclick = () => showPicker(blocks);  // same session — edits persist
send.onclick = submit;
input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
boot();
</script>
</body>
</html>
