<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pattern Drafting Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e1e4e9; --border-strong: #c9ced6;
    --text: #1a1d23; --text-dim: #6b7280; --text-faint: #9aa1ab;
    --accent: #2563eb; --accent-dim: #dbeafe;
    --ok: #16a34a; --ok-bg: #ecfdf3;
    --fail: #dc2626; --fail-bg: #fef2f2;
    --construction: #b8bec9;
    --mono: "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans); color: var(--text); background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden; font-size: 14px;
  }
  button {
    font-family: inherit; font-size: 13px; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--border-strong); background: var(--panel); color: var(--text);
    padding: 6px 12px; transition: background .1s;
  }
  button:hover { background: #f0f1f3; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.ghost { border-color: transparent; background: transparent; }
  button.ghost:hover { background: #eceef1; }
  input, select, textarea {
    font-family: inherit; font-size: 13px; border: 1px solid var(--border-strong);
    border-radius: 6px; padding: 6px 10px; color: var(--text); background: #fff;
  }
  a { color: var(--accent); }

  /* --- library --------------------------------------------------------- */
  #library { flex: 1; overflow: auto; padding: 48px; display: none; }
  #library.active { display: block; }
  .lib-header { display: flex; align-items: baseline; justify-content: space-between; max-width: 900px; margin: 0 auto 24px; }
  .lib-header h1 { font-size: 20px; margin: 0; }
  .lib-actions { display: flex; gap: 8px; }
  .lib-list { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .lib-item {
    display: flex; align-items: center; justify-content: space-between; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  }
  .lib-item:hover { border-color: var(--border-strong); }
  .lib-item .name { font-weight: 600; }
  .lib-item .meta { color: var(--text-dim); font-size: 12px; }
  .lib-empty { text-align: center; color: var(--text-dim); padding: 64px 0; }

  /* --- workspace --------------------------------------------------------- */
  #workspace { flex: 1; display: none; min-height: 0; flex-direction: column; }
  #workspace.active { display: flex; }

  #topbar {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0;
  }
  #topbar .pattern-name { font-weight: 600; font-size: 14px; }
  #topbar .spacer { flex: 1; }
  #topbar .summary { color: var(--text-dim); font-size: 12px; }
  #topbar select { min-width: 130px; }

  #main { flex: 1; display: flex; min-height: 0; }
  #canvas-pane {
    flex: 1 1 60%; min-width: 240px; display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--border);
  }
  #canvas-toolbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  #canvas-wrap { flex: 1; overflow: auto; padding: 16px; display: flex; align-items: center; justify-content: center; }
  #canvas-wrap svg { max-width: 100%; height: auto; }
  #canvas-wrap.empty { color: var(--text-faint); }

  #divider { width: 6px; cursor: col-resize; background: transparent; flex-shrink: 0; position: relative; }
  #divider:hover, #divider.dragging { background: var(--accent-dim); }

  #side-pane { flex: 0 0 40%; min-width: 320px; display: flex; flex-direction: column; background: var(--bg); }

  #instruction-bar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); background: var(--panel); flex-shrink: 0; }
  #instruction-input {
    flex: 1; resize: none; min-height: 38px; max-height: 140px; line-height: 1.4;
  }
  #run-btn { flex-shrink: 0; align-self: flex-end; }

  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 14px; }
  .log-empty { color: var(--text-faint); text-align: center; padding: 48px 12px; font-size: 13px; }

  .run-block { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden; }
  .run-header { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 8px; }
  .run-header .instruction { flex: 1; font-weight: 500; }
  .run-header .run-meta { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .run-final { padding: 6px 12px; font-size: 12px; color: var(--text-dim); border-top: 1px solid var(--border); background: #fafbfc; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 600; }
  .badge.done { background: var(--ok-bg); color: var(--ok); }
  .badge.error, .badge.max_steps { background: var(--fail-bg); color: var(--fail); }
  .badge.no_key { background: #fff7ed; color: #c2410c; }

  .action-list { display: flex; flex-direction: column; }
  .action-row {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer;
    border-top: 1px solid var(--border); font-size: 12.5px;
  }
  .action-row:first-child { border-top: none; }
  .action-row:hover { background: #f5f6f8; }
  .action-row.selected { background: var(--accent-dim); }
  .action-row .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .action-row .dot.ok { background: var(--ok); }
  .action-row .dot.fail { background: var(--fail); }
  .action-row .tool { font-family: var(--mono); font-weight: 600; flex-shrink: 0; }
  .action-row .msg { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

  /* --- action detail panel ------------------------------------------------ */
  #detail-overlay {
    position: fixed; inset: 0; background: rgba(20,22,26,.35); display: none;
    align-items: center; justify-content: center; z-index: 50;
  }
  #detail-overlay.active { display: flex; }
  #detail-panel {
    width: min(980px, 94vw); height: min(720px, 90vh); background: var(--panel);
    border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; overflow: hidden;
  }
  #detail-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  #detail-header .tool { font-family: var(--mono); font-weight: 700; }
  #detail-header .spacer { flex: 1; }
  #detail-reasoning {
    padding: 10px 16px; background: #fffbeb; border-bottom: 1px solid var(--border);
    font-size: 13px; color: #78350f; font-style: italic; max-height: 90px; overflow-y: auto;
  }
  #detail-reasoning.empty { display: none; }
  #detail-body { flex: 1; display: flex; min-height: 0; }
  .detail-render { flex: 1; display: flex; flex-direction: column; border-right: 1px solid var(--border); min-width: 0; }
  .detail-render:last-child { border-right: none; }
  .detail-render h4 { margin: 0; padding: 8px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); border-bottom: 1px solid var(--border); background: #fafbfc; }
  .detail-render .render-wrap { flex: 1; overflow: auto; padding: 10px; display: flex; align-items: center; justify-content: center; }
  .detail-render svg { max-width: 100%; height: auto; }
  #detail-raw {
    border-top: 1px solid var(--border); background: #0d1117; color: #c9d1d9; font-family: var(--mono);
    font-size: 11.5px; padding: 10px 16px; max-height: 140px; overflow: auto; white-space: pre-wrap;
  }

  /* --- versions panel ------------------------------------------------- */
  #versions-overlay {
    position: fixed; inset: 0; background: rgba(20,22,26,.35); display: none;
    align-items: center; justify-content: center; z-index: 50;
  }
  #versions-overlay.active { display: flex; }
  #versions-panel { width: min(560px, 92vw); max-height: 80vh; background: var(--panel); border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.25); display: flex; flex-direction: column; overflow: hidden; }
  #versions-header { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  #versions-header h3 { margin: 0; flex: 1; font-size: 14px; }
  #versions-list { overflow-y: auto; padding: 8px; }
  .version-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; }
  .version-row:hover { background: #f5f6f8; }
  .version-row .vlabel { flex: 1; font-size: 13px; }
  .version-row .vmeta { font-size: 11px; color: var(--text-faint); }
  .version-row.current .vlabel { font-weight: 700; color: var(--accent); }

  .hidden { display: none !important; }
  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: #1a1d23; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ============================== LIBRARY ============================== -->
<div id="library">
  <div class="lib-header">
    <h1>Pattern Drafting Workspace</h1>
    <div class="lib-actions">
      <button id="new-blank">New blank pattern</button>
      <button id="new-sample">Open Aldrich sample</button>
      <button id="new-import">Import .sm2d…</button>
      <input type="file" id="import-file" accept=".sm2d,.val,.xml" class="hidden">
    </div>
  </div>
  <div class="lib-list" id="lib-list"></div>
</div>

<!-- ============================= WORKSPACE ============================== -->
<div id="workspace">
  <div id="topbar">
    <button class="ghost" id="back-to-library" title="Back to library">←</button>
    <span class="pattern-name" id="pattern-name">—</span>
    <span class="summary" id="state-summary"></span>
    <div class="spacer"></div>
    <select id="block-select"><option value="">Whole pattern</option></select>
    <select id="model-select"></select>
    <button id="versions-btn">Versions</button>
    <button id="save-btn">Save</button>
    <button id="export-btn">Export .sm2d</button>
  </div>

  <div id="main">
    <div id="canvas-pane">
      <div id="canvas-toolbar">
        <span style="font-size:12px;color:var(--text-dim)">Pattern view</span>
      </div>
      <div id="canvas-wrap" class="empty"><span>No geometry yet</span></div>
    </div>
    <div id="divider"></div>
    <div id="side-pane">
      <div id="instruction-bar">
        <textarea id="instruction-input" placeholder="Type an instruction — e.g. “split the bodice front along the princess line from B4 to the hem”" rows="1"></textarea>
        <button class="primary" id="run-btn">Run</button>
      </div>
      <div id="log"></div>
    </div>
  </div>
</div>

<!-- ========================= ACTION DETAIL MODAL ========================= -->
<div id="detail-overlay">
  <div id="detail-panel">
    <div id="detail-header">
      <span class="dot" id="detail-dot" style="width:9px;height:9px;border-radius:50%"></span>
      <span class="tool" id="detail-tool"></span>
      <span class="spacer"></span>
      <span id="detail-message" style="font-size:12px;color:var(--text-dim)"></span>
      <button class="ghost" id="detail-close">✕</button>
    </div>
    <div id="detail-reasoning"></div>
    <div id="detail-body">
      <div class="detail-render">
        <h4>Before</h4>
        <div class="render-wrap" id="detail-before"></div>
      </div>
      <div class="detail-render">
        <h4>After</h4>
        <div class="render-wrap" id="detail-after"></div>
      </div>
    </div>
    <pre id="detail-raw"></pre>
  </div>
</div>

<!-- ============================ VERSIONS MODAL =========================== -->
<div id="versions-overlay">
  <div id="versions-panel">
    <div id="versions-header">
      <h3>Version history</h3>
      <button class="ghost" id="versions-close">✕</button>
    </div>
    <div id="versions-list"></div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";

// --- state ------------------------------------------------------------
let session = null;          // the full /api/sessions/{sid} view
let selectedAction = null;   // {runId, stepIndex}

const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).detail || msg; } catch (e) {}
    throw new Error(msg);
  }
  return res.json();
}

// --- library ------------------------------------------------------------
async function showLibrary() {
  localStorage.removeItem("vla_session_id");
  $("#workspace").classList.remove("active");
  $("#library").classList.add("active");
  const data = await api("GET", "/api/patterns");
  const list = $("#lib-list");
  list.innerHTML = "";
  if (!data.patterns.length) {
    list.appendChild(el("div", "lib-empty", "No patterns yet — start a new one above."));
    return;
  }
  for (const p of data.patterns) {
    const row = el("div", "lib-item");
    const left = el("div");
    left.appendChild(el("div", "name", p.name));
    left.appendChild(el("div", "meta", `${p.versions} version${p.versions === 1 ? "" : "s"}`));
    row.appendChild(left);
    row.onclick = async () => {
      const vers = await api("GET", `/api/patterns/${p.id}/versions`);
      const latest = vers.versions[vers.versions.length - 1];
      const existing = vers.sessions.find((s) => s.version_id === latest.id);
      const v = existing
        ? await api("GET", `/api/sessions/${existing.id}`)
        : await api("POST", `/api/patterns/${p.id}/open`, { version_id: latest.id });
      enterWorkspace(v);
    };
    list.appendChild(row);
  }
}

$("#new-blank").onclick = async () => {
  const name = prompt("Pattern name", "Untitled pattern") || "Untitled pattern";
  enterWorkspace(await api("POST", "/api/patterns", { name, source: "blank" }));
};
$("#new-sample").onclick = async () => {
  enterWorkspace(await api("POST", "/api/patterns", { name: "Aldrich basic", source: "sample" }));
};
$("#new-import").onclick = () => $("#import-file").click();
$("#import-file").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch("/api/patterns/import", { method: "POST", body: fd });
  if (!res.ok) { toast("Import failed"); return; }
  enterWorkspace(await res.json());
};
$("#back-to-library").onclick = showLibrary;

// --- workspace ------------------------------------------------------------
function enterWorkspace(view) {
  session = view;
  localStorage.setItem("vla_session_id", view.session_id);
  $("#library").classList.remove("active");
  $("#workspace").classList.add("active");
  render();
}

async function refresh() {
  session = await api("GET", `/api/sessions/${session.session_id}`);
  render();
}

function render() {
  $("#pattern-name").textContent = session.pattern.name || "Untitled";
  const s = session.state_summary;
  $("#state-summary").textContent = `${s.objects} objects · ${s.pieces} pieces` + (s.unresolved ? ` · ${s.unresolved} unresolved` : "");

  const canvasWrap = $("#canvas-wrap");
  if (session.svg) {
    canvasWrap.classList.remove("empty");
    canvasWrap.innerHTML = session.svg;
  } else {
    canvasWrap.classList.add("empty");
    canvasWrap.innerHTML = "<span>No geometry yet</span>";
  }

  const blockSel = $("#block-select");
  blockSel.innerHTML = '<option value="">Whole pattern</option>';
  for (const b of session.blocks) {
    const o = el("option", null, b.label);
    o.value = b.key;
    blockSel.appendChild(o);
  }
  blockSel.value = session.block ? session.block.key : "";

  const modelSel = $("#model-select");
  modelSel.innerHTML = "";
  for (const m of session.models) {
    const o = el("option", null, `${m.label} — ${m.note}`);
    o.value = m.id;
    modelSel.appendChild(o);
  }
  modelSel.value = session.model;

  renderLog();
}

$("#block-select").onchange = async (e) => {
  session = await api("POST", `/api/sessions/${session.session_id}/select_block`, { block: e.target.value });
  render();
};
$("#model-select").onchange = async (e) => {
  session = await api("POST", `/api/sessions/${session.session_id}/model`, { model: e.target.value });
  render();
};
$("#save-btn").onclick = async () => {
  const label = prompt("Label this version (optional)", "") || "";
  session = await api("POST", `/api/sessions/${session.session_id}/save`, { label });
  toast("Saved.");
  render();
};
$("#export-btn").onclick = () => {
  window.location = `/api/sessions/${session.session_id}/export.sm2d`;
};

// --- instruction bar / action log -----------------------------------------
const input = $("#instruction-input");
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(140, input.scrollHeight) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); runInstruction(); }
});
$("#run-btn").onclick = runInstruction;

async function runInstruction() {
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.style.height = "auto";
  $("#run-btn").disabled = true;
  $("#run-btn").textContent = "Running…";
  try {
    session = await api("POST", `/api/sessions/${session.session_id}/run`, { text });
    render();
    $("#log").scrollTop = $("#log").scrollHeight;
  } catch (err) {
    toast("Run failed: " + err.message);
  } finally {
    $("#run-btn").disabled = false;
    $("#run-btn").textContent = "Run";
  }
}

function renderLog() {
  const log = $("#log");
  log.innerHTML = "";
  if (!session.runs.length) {
    log.appendChild(el("div", "log-empty", "Type an instruction below to start drafting. Every run becomes a saved, branchable step in this log."));
    return;
  }
  for (const run of session.runs) {
    log.appendChild(renderRun(run));
  }
  log.scrollTop = log.scrollHeight;
}

function renderRun(run) {
  const block = el("div", "run-block");

  const header = el("div", "run-header");
  header.appendChild(el("div", "instruction", run.instruction));
  const meta = el("div", "run-meta");
  meta.appendChild(el("span", `badge ${run.stopped_reason}`, badgeLabel(run.stopped_reason)));
  if (run.version_after_id) {
    const b = el("button", "ghost", "⑂ branch from here");
    b.title = "Open a new session starting from what this run produced";
    b.onclick = async (e) => {
      e.stopPropagation();
      const v = await api("POST", `/api/sessions/${session.session_id}/runs/${run.id}/branch`);
      enterWorkspace(v);
      toast("Branched — you're now on a new session.");
    };
    meta.appendChild(b);
  }
  header.appendChild(meta);
  block.appendChild(header);

  if (run.actions.length) {
    const list = el("div", "action-list");
    for (const a of run.actions) {
      list.appendChild(renderAction(run, a));
    }
    block.appendChild(list);
  }

  if (run.final_text) {
    block.appendChild(el("div", "run-final", run.final_text));
  }
  return block;
}

function badgeLabel(reason) {
  return { done: "done", error: "error", max_steps: "stopped (max steps)", no_key: "no API key" }[reason] || reason;
}

function renderAction(run, action) {
  const row = el("div", "action-row");
  const dot = el("span", `dot ${action.ok ? "ok" : "fail"}`);
  const tool = el("span", "tool", action.tool_name);
  const msg = el("span", "msg", action.message);
  row.append(dot, tool, msg);
  row.onclick = () => openActionDetail(run, action);
  return row;
}

// --- action detail ----------------------------------------------------
async function openActionDetail(run, action) {
  $("#detail-overlay").classList.add("active");
  $("#detail-tool").textContent = action.tool_name;
  $("#detail-dot").style.background = action.ok ? "var(--ok)" : "var(--fail)";
  $("#detail-message").textContent = action.message;
  const reasoning = $("#detail-reasoning");
  if (action.reasoning) {
    reasoning.textContent = action.reasoning;
    reasoning.classList.remove("empty");
  } else {
    reasoning.classList.add("empty");
  }
  $("#detail-before").innerHTML = "<span style='color:var(--text-faint)'>Loading…</span>";
  $("#detail-after").innerHTML = "";
  $("#detail-raw").textContent = JSON.stringify({ tool_input: action.tool_input, blocked_by: action.blocked_by, touched_ids: action.touched_ids }, null, 2);

  try {
    const detail = await api("GET", `/api/runs/${run.id}/actions/${action.step_index}/detail`);
    $("#detail-before").innerHTML = detail.before.svg;
    $("#detail-after").innerHTML = detail.after.svg;
  } catch (err) {
    $("#detail-before").innerHTML = `<span style="color:var(--fail)">${err.message}</span>`;
  }
}
$("#detail-close").onclick = () => $("#detail-overlay").classList.remove("active");
$("#detail-overlay").onclick = (e) => { if (e.target.id === "detail-overlay") $("#detail-overlay").classList.remove("active"); };

// --- versions -----------------------------------------------------------
$("#versions-btn").onclick = async () => {
  $("#versions-overlay").classList.add("active");
  const pid = session.pattern.id;
  const data = pid ? await api("GET", `/api/patterns/${pid}/versions`) : { versions: [] };
  const list = $("#versions-list");
  list.innerHTML = "";
  if (!data.versions.length) {
    list.appendChild(el("div", "lib-empty", "No saved versions yet."));
    return;
  }
  const byId = Object.fromEntries(data.versions.map((v) => [v.id, v]));
  const depth = (v) => (v.parent_id && byId[v.parent_id] ? 1 + depth(byId[v.parent_id]) : 0);
  for (const v of data.versions) {
    const row = el("div", "version-row" + (v.id === session.version_id ? " current" : ""));
    row.style.paddingLeft = 10 + depth(v) * 16 + "px";
    row.appendChild(el("span", "vlabel", v.label || v.id));
    row.appendChild(el("span", "vmeta", new Date(v.created_at * 1000).toLocaleString()));
    const openBtn = el("button", "ghost", "Open");
    openBtn.onclick = async () => {
      const opened = await api("POST", `/api/patterns/${pid}/open`, { version_id: v.id });
      $("#versions-overlay").classList.remove("active");
      enterWorkspace(opened);
    };
    row.appendChild(openBtn);
    list.appendChild(row);
  }
};
$("#versions-close").onclick = () => $("#versions-overlay").classList.remove("active");
$("#versions-overlay").onclick = (e) => { if (e.target.id === "versions-overlay") $("#versions-overlay").classList.remove("active"); };

// --- resizable divider ----------------------------------------------------
(() => {
  const divider = $("#divider");
  const canvasPane = $("#canvas-pane");
  let dragging = false;
  const saved = localStorage.getItem("vla_canvas_width");
  if (saved) canvasPane.style.flex = `0 0 ${saved}px`;

  divider.addEventListener("mousedown", () => {
    dragging = true;
    divider.classList.add("dragging");
    document.body.style.cursor = "col-resize";
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    const mainRect = $("#main").getBoundingClientRect();
    const w = Math.max(240, Math.min(mainRect.width - 320, e.clientX - mainRect.left));
    canvasPane.style.flex = `0 0 ${w}px`;
  });
  window.addEventListener("mouseup", () => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove("dragging");
    document.body.style.cursor = "";
    localStorage.setItem("vla_canvas_width", parseInt(canvasPane.style.flexBasis, 10));
  });
})();

// --- boot -----------------------------------------------------------------
(async () => {
  const sid = localStorage.getItem("vla_session_id");
  if (sid) {
    try {
      enterWorkspace(await api("GET", `/api/sessions/${sid}`));
      return;
    } catch (e) { /* stale session id — fall through to library */ }
  }
  showLibrary();
})();
</script>
</body>
</html>
