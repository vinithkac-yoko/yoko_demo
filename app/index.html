<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>Pattern VLA</title>
<style>
  :root {
    --bg:#fbfbfb; --panel:#fff; --line:#e6e6e6; --ink:#111; --muted:#777;
    --accent:#c026d3; --added:#2563eb; --ok:#16a34a;
    --chat-h: 42vh;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:-apple-system,system-ui,sans-serif;
              background:var(--bg); color:var(--ink); overscroll-behavior:none; }
  #app { display:flex; flex-direction:column; height:100dvh; }

  header { padding:8px 12px; border-bottom:1px solid var(--line); font-size:14px;
           display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  header .dot { width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none; }
  header .title { flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .sub { color:var(--muted); font-weight:400; }
  .hbtn { border:1px solid var(--line); background:#f4f4f6; color:var(--ink); border-radius:14px;
          padding:5px 10px; font-size:13px; font-weight:600; white-space:nowrap; }
  .hbtn.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  select.hbtn { max-width:34vw; }

  /* ---------- library / start screen ---------- */
  #library { flex:1 1 auto; overflow-y:auto; padding:16px; display:none; }
  #library h2 { font-size:16px; margin:2px 0 10px; }
  #library h3 { font-size:13px; color:var(--muted); margin:20px 0 8px; text-transform:uppercase;
                letter-spacing:.04em; }
  .card { border:1px solid var(--line); background:#fff; border-radius:14px; padding:14px;
          margin-bottom:10px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > input[type=text] { flex:1; padding:11px 13px; border:1px solid var(--line);
                            border-radius:12px; font-size:16px; }
  .listitem { width:100%; text-align:left; border:1px solid var(--line); background:#fff;
              border-radius:12px; padding:13px 14px; margin-bottom:8px; font-size:15px;
              font-weight:600; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .listitem small { color:var(--muted); font-weight:400; }

  /* ---------- workspace ---------- */
  #work { flex:1 1 auto; min-height:0; display:none; flex-direction:column; }
  #view { flex:1 1 auto; min-height:0; overflow:auto; display:flex; align-items:center;
          justify-content:center; padding:6px; background:#fff; }
  #view svg { max-width:100%; max-height:100%; width:auto; height:auto; display:block; }
  #view .empty { color:var(--muted); font-size:14px; text-align:center; padding:24px; line-height:1.5; }

  #divider { flex:0 0 auto; height:22px; background:var(--panel); border-top:1px solid var(--line);
             display:flex; align-items:center; justify-content:center; cursor:row-resize;
             touch-action:none; user-select:none; -webkit-user-select:none; }
  #divider.dragging { background:#eef1f6; }
  #divider .grip { width:44px; height:5px; border-radius:3px; background:#c9ccd2; }

  #chat { flex:0 0 auto; height:var(--chat-h); min-height:0; display:flex; flex-direction:column;
          background:var(--panel); }
  .tabs { flex:0 0 auto; display:flex; gap:6px; padding:6px 10px 0; }
  .tab { border:0; background:transparent; color:var(--muted); font-size:13px; font-weight:600;
         padding:5px 9px; border-radius:10px; }
  .tab.on { background:#f0f0f2; color:var(--ink); }
  .pane { flex:1 1 auto; min-height:0; overflow-y:auto; padding:8px 12px;
          display:flex; flex-direction:column; gap:8px; }
  .pane.hide { display:none; }
  .msg { max-width:88%; padding:8px 11px; border-radius:14px; font-size:14px; line-height:1.4;
         white-space:pre-wrap; word-wrap:break-word; position:relative; }
  .user { align-self:flex-end; background:var(--ink); color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:#f0f0f2; color:var(--ink); border-bottom-left-radius:4px; }
  .note { align-self:center; background:transparent; color:var(--muted); font-size:12px;
          padding:1px 6px; max-width:96%; text-align:center; }
  .branch { align-self:flex-end; border:0; background:transparent; color:var(--muted);
            font-size:11px; padding:0 4px 2px; }
  .ver { display:flex; align-items:center; gap:8px; font-size:13px; padding:7px 9px;
         border:1px solid var(--line); border-radius:10px; background:#fff; }
  .ver.cur { border-color:var(--ink); }
  .ver .lbl { flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ver .meta { color:var(--muted); font-size:11px; }
  .ver button { border:1px solid var(--line); background:#f4f4f6; border-radius:9px;
                font-size:11px; font-weight:600; padding:3px 8px; }

  #bar { flex:0 0 auto; display:flex; gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
         border-top:1px solid var(--line); }
  #bar input { flex:1; padding:11px 13px; border:1px solid var(--line); border-radius:22px;
               font-size:16px; outline:none; }
  #bar button { padding:0 16px; border:0; border-radius:22px; background:var(--ink); color:#fff;
                font-size:15px; font-weight:600; }
  #bar button:disabled { opacity:.5; }
  .banner { margin:0 12px 6px; padding:7px 10px; border-radius:10px; background:#eef6ff;
            color:#1e40af; font-size:12px; display:none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="dot"></span>
    <span class="title" id="title">Pattern VLA</span>
    <select class="hbtn" id="blocksel" style="display:none"></select>
    <select class="hbtn" id="modelsel" style="display:none" title="Model"></select>
    <button class="hbtn" id="save" style="display:none">Save</button>
    <button class="hbtn" id="dl" style="display:none" title="Download .sm2d">↓</button>
    <button class="hbtn" id="expand" style="display:none" title="Resize panels">⇕</button>
    <button class="hbtn" id="home" style="display:none">☰</button>
  </header>

  <!-- library -->
  <div id="library">
    <h2>Start a pattern</h2>
    <div class="card">
      <div class="row">
        <input type="text" id="newname" placeholder="Pattern name" value="Untitled pattern" />
        <button class="hbtn primary" id="newblank">Blank canvas</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="hbtn" id="newsample">Open Aldrich sample</button>
        <label class="hbtn" for="importfile">Import .sm2d…</label>
        <input type="file" id="importfile" accept=".sm2d,.val,.xml" style="display:none" />
      </div>
    </div>
    <h3>Your patterns</h3>
    <div id="patterns"></div>
    <h3>Recent sessions</h3>
    <div id="recent"></div>
  </div>

  <!-- workspace -->
  <div id="work">
    <div id="view"><div class="empty" id="viewempty"></div></div>
    <div id="divider" title="Drag to resize"><div class="grip"></div></div>
    <div id="chat">
      <div class="tabs">
        <button class="tab on" data-pane="log">Chat</button>
        <button class="tab" data-pane="hist">History</button>
      </div>
      <div class="banner" id="banner"></div>
      <div class="pane" id="log"></div>
      <div class="pane hide" id="hist"></div>
      <div id="bar">
        <input id="input" placeholder="e.g. draft a skirt block from the waist" autocomplete="off" />
        <button id="send">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = location.origin;
let S = null;          // latest session view from the server
let branchFrom = null; // message id to branch the next turn from

const $ = id => document.getElementById(id);
const root = document.documentElement;

/* ---------- resizable split ---------- */
const MIN_CHAT = 90;
const maxChat = () => Math.max(140, window.innerHeight - 190);
function setChatH(px, save = true) {
  const h = Math.min(Math.max(px, MIN_CHAT), maxChat());
  root.style.setProperty('--chat-h', h + 'px');
  if (save) localStorage.setItem('chatH', String(h));
}
const savedH = parseInt(localStorage.getItem('chatH') || '', 10);
setChatH(Number.isFinite(savedH) ? savedH : Math.round(window.innerHeight * 0.42), false);
let dragging = false;
const divider = $('divider');
divider.addEventListener('pointerdown', e => {
  dragging = true; divider.classList.add('dragging');
  divider.setPointerCapture(e.pointerId); e.preventDefault();
});
divider.addEventListener('pointermove', e => {
  if (dragging) setChatH(window.innerHeight - e.clientY - divider.offsetHeight / 2);
});
const endDrag = e => {
  dragging = false; divider.classList.remove('dragging');
  try { divider.releasePointerCapture(e.pointerId); } catch (_) {}
};
divider.addEventListener('pointerup', endDrag);
divider.addEventListener('pointercancel', endDrag);
$('expand').onclick = () => {
  const cur = parseInt(getComputedStyle(root).getPropertyValue('--chat-h'));
  const big = Math.round(window.innerHeight * 0.72), small = MIN_CHAT + 30;
  setChatH(cur > (big + small) / 2 ? small : big);
};

/* ---------- api ---------- */
async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    method: opts.method || 'POST',
    headers: opts.body instanceof FormData ? undefined : {'Content-Type': 'application/json'},
    body: opts.body instanceof FormData ? opts.body
          : (opts.body === undefined ? undefined : JSON.stringify(opts.body)),
  });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 200));
  return r.json();
}
const get = path => api(path, {method: 'GET', body: undefined});

/* ---------- library ---------- */
function showLibrary(data) {
  $('library').style.display = 'block';
  $('work').style.display = 'none';
  ['blocksel','modelsel','save','dl','expand','home'].forEach(i => $(i).style.display = 'none');
  $('title').textContent = 'Pattern VLA';

  const pats = $('patterns');
  pats.innerHTML = data.patterns.length ? '' :
    '<div class="note" style="text-align:left">No saved patterns yet — start a blank canvas above.</div>';
  data.patterns.forEach(p => {
    const el = document.createElement('button');
    el.className = 'listitem';
    el.innerHTML = `<span>${esc(p.name)}</span><small>${p.versions} version${p.versions===1?'':'s'} ›</small>`;
    el.onclick = () => openPatternVersions(p);
    pats.appendChild(el);
  });

  const rec = $('recent');
  rec.innerHTML = '';
  (data.sessions || []).slice(0, 8).forEach(s => {
    const el = document.createElement('button');
    el.className = 'listitem';
    el.innerHTML = `<span>${esc(s.pattern_name || s.title || 'session')}</span>` +
                   `<small>${when(s.updated_at)} ›</small>`;
    el.onclick = () => loadSession(s.id);
    rec.appendChild(el);
  });
}

async function openPatternVersions(p) {
  const data = await get(`/api/patterns/${p.id}/versions`);
  const pats = $('patterns');
  pats.innerHTML = `<div class="card"><div class="row" style="margin-bottom:8px">
      <b style="flex:1">${esc(p.name)}</b>
      <button class="hbtn" id="backlib">← All</button></div>
      <div id="vlist"></div></div>`;
  $('backlib').onclick = refreshLibrary;
  const vl = $('vlist');
  data.versions.forEach(v => {
    const el = document.createElement('div');
    el.className = 'ver';
    el.style.marginBottom = '6px';
    el.innerHTML = `<span class="lbl">${esc(v.label || v.id)}</span>
        <span class="meta">${v.parent_id ? 'branch' : 'root'}</span>
        <button>Open</button>`;
    el.querySelector('button').onclick = async () => {
      const s = await api(`/api/patterns/${p.id}/open`, {body: {version_id: v.id}});
      render(s);
    };
    vl.appendChild(el);
  });
}

async function refreshLibrary() {
  showLibrary(await get('/api/patterns'));
}

$('newblank').onclick = async () => {
  const s = await api('/api/patterns', {body: {name: $('newname').value || 'Untitled pattern', source: 'blank'}});
  render(s);
};
$('newsample').onclick = async () => {
  const s = await api('/api/patterns', {body: {name: 'Aldrich sample', source: 'sample'}});
  render(s);
};
$('importfile').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append('file', f);
  render(await api('/api/patterns/import', {body: fd}));
};

/* ---------- workspace ---------- */
function render(s) {
  S = s;
  $('library').style.display = 'none';
  $('work').style.display = 'flex';
  ['save','dl','expand','home'].forEach(i => $(i).style.display = 'inline-block');
  $('title').innerHTML = `${esc(s.pattern.name || 'Pattern')} ` +
    `<span class="sub">· ${s.state_summary.objects} objects</span>`;

  // block selector (whole pattern + each block)
  const sel = $('blocksel');
  sel.style.display = s.blocks.length ? 'inline-block' : 'none';
  sel.innerHTML = '<option value="">Whole pattern</option>' +
    s.blocks.map(b => `<option value="${b.key}">${esc(b.label)}</option>`).join('');
  sel.value = s.block ? s.block.key : '';
  sel.onchange = async () => render(await api(`/api/sessions/${s.session_id}/select_block`,
                                              {body: {block: sel.value}}));

  // model picker — cheap for tweaks, strong for hard drafting
  const msel = $('modelsel');
  msel.style.display = 'inline-block';
  msel.innerHTML = (s.models || []).map(m =>
    `<option value="${m.id}" title="${esc(m.note)}">${esc(m.label)}</option>`).join('');
  msel.value = s.model;
  msel.title = (s.models || []).find(m => m.id === s.model)?.note || 'Model';
  msel.onchange = async () => render(await api(`/api/sessions/${s.session_id}/model`,
                                               {body: {model: msel.value}}));

  // pattern
  const view = $('view');
  if (s.svg && s.state_summary.points > 1) {
    view.innerHTML = '';
    const host = document.createElement('div');
    host.style.cssText = 'display:flex;width:100%;height:100%;align-items:center;justify-content:center';
    host.innerHTML = s.svg;
    view.appendChild(host);
  } else {
    view.innerHTML = `<div class="empty">Blank canvas — point <b>A</b> is at the origin.<br>
      Ask for what you want drafted, e.g.<br>
      “from A, go down 57cm to B, then right waist_circ/4+2 to C”.</div>`;
  }

  drawChat(s);
  drawHistory(s);
  $('input').focus();
}

function drawChat(s) {
  const log = $('log');
  log.innerHTML = '';
  (s.messages || []).forEach(m => {
    const who = m.role === 'user' ? 'user' : (m.role === 'note' ? 'note' : 'bot');
    addMsg(m.text, who);
    (m.tool_calls || []).forEach(tc => addMsg((tc.ok ? '✏️ ' : '⚠️ ') + tc.message, 'note'));
    if (m.role === 'user') {
      const b = document.createElement('button');
      b.className = 'branch';
      b.textContent = '⑂ branch from here';
      b.onclick = () => setBranch(m.id, m.text);
      log.appendChild(b);
    }
  });
  log.scrollTop = log.scrollHeight;
}

function drawHistory(s) {
  const h = $('hist');
  h.innerHTML = '';
  if (!s.versions.length) { h.innerHTML = '<div class="note">No versions saved yet.</div>'; return; }
  const byId = {};
  s.versions.forEach(v => byId[v.id] = v);
  s.versions.forEach(v => {
    let depth = 0, p = v.parent_id;
    while (p && byId[p] && depth < 12) { depth++; p = byId[p].parent_id; }
    const el = document.createElement('div');
    el.className = 'ver' + (v.id === s.version_id ? ' cur' : '');
    el.style.marginLeft = (depth * 14) + 'px';
    el.innerHTML = `<span class="lbl">${esc(v.label || v.id)}</span>
      <span class="meta">${when(v.created_at)}</span>
      <button data-a="open">Open</button><button data-a="dl">↓</button>`;
    el.querySelector('[data-a=open]').onclick = async () =>
      render(await api(`/api/patterns/${s.pattern.id}/open`, {body: {version_id: v.id}}));
    el.querySelector('[data-a=dl]').onclick = () =>
      window.location = `${API}/api/versions/${v.id}/export.sm2d`;
    h.appendChild(el);
  });
}

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
}

function setBranch(id, text) {
  branchFrom = id;
  const b = $('banner');
  b.style.display = 'block';
  b.textContent = '⑂ Branching from: "' + text.slice(0, 60) + '" — your next message starts a new thread. Tap to cancel.';
  b.onclick = () => { branchFrom = null; b.style.display = 'none'; };
  $('input').focus();
}

async function submit() {
  const text = $('input').value.trim();
  if (!text || !S) return;
  $('input').value = '';
  $('input').disabled = $('send').disabled = true;
  addMsg(text, 'user');
  addMsg('…thinking', 'note');
  try {
    const s = await api(`/api/sessions/${S.session_id}/message`,
                        {body: {text, parent_id: branchFrom}});
    branchFrom = null; $('banner').style.display = 'none';
    render(s);
  } catch (e) {
    addMsg('⚠️ ' + e.message, 'bot');
  } finally {
    $('input').disabled = $('send').disabled = false;
    $('input').focus();
  }
}

$('send').onclick = submit;
$('input').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
$('save').onclick = async () => {
  const label = prompt('Version label', 'edit ' + new Date().toLocaleTimeString()) ;
  if (label === null) return;
  render(await api(`/api/sessions/${S.session_id}/save`, {body: {label}}));
};
$('dl').onclick = () => window.location = `${API}/api/sessions/${S.session_id}/export.sm2d`;
$('home').onclick = refreshLibrary;
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  $('log').classList.toggle('hide', t.dataset.pane !== 'log');
  $('hist').classList.toggle('hide', t.dataset.pane !== 'hist');
});

async function loadSession(id) { render(await get('/api/sessions/' + id)); }

/* ---------- utils ---------- */
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
function when(ts) {
  if (!ts) return '';
  const d = new Date(ts * 1000), diff = (Date.now() - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return d.toLocaleDateString();
}

refreshLibrary().catch(() => {
  $('library').style.display = 'block';
  $('patterns').innerHTML = '<div class="note">Could not reach the backend.</div>';
});
</script>
</body>
</html>
