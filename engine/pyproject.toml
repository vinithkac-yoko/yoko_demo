[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seamly-engine"
version = "0.1.0"
description = "Headless Seamly2D-compatible pattern engine: a machine-agent environment for sewing-pattern drafting"
readme = "../README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["seamly_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
